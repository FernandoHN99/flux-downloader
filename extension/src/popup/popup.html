<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <title>Flux</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="popup-brand">
        <span class="popup-logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </span>
        <h1 class="popup-title">Flux</h1>
      </div>
      <div class="header-actions">
        <button id="refresh-all-btn" class="icon-btn" aria-label="Refresh" title="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <polyline points="21 3 21 9 15 9"></polyline>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" aria-label="Open Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        </button>
      </div>
    </header>
    
    <!-- Status Bar -->
    <div id="status-bar" class="status-bar" role="status" aria-live="polite">
      <span id="status-text">Checking for media…</span>
    </div>
    
    <!-- Empty State -->
    <div id="empty-state" class="empty-state">
      <svg class="empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <p>No media detected on this page</p>
      <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
    </div>
    
    <!-- Selected Media Details -->
    <div id="media-details" class="media-details hidden">
      <div class="media-details-header">
        <h2 id="media-title">Video Title</h2>
        <button id="close-details-btn" class="icon-btn-sm" aria-label="Close details" title="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div id="quality-list" class="quality-list"></div>
    </div>
    
    <!-- Download Section -->
    <div id="download-section" class="download-section hidden">
      <button id="download-btn" class="btn btn-primary">
        <span class="btn-text">Download</span>
        <span class="btn-progress hidden">Downloading…</span>
      </button>
    </div>
    
    <!-- Batch download status -->
    <div id="batch-status" class="batch-status hidden" role="status" aria-live="polite">
      <div class="batch-info">
        <span id="batch-count">0 / 0</span>
        <span id="batch-title"></span>
      </div>
      <button id="batch-stop-btn" class="btn btn-cancel">Stop</button>
    </div>

    <!-- History -->
    <div id="history-section" class="history-section hidden">
      <div class="history-header">
        <span class="history-label">Videos</span>
        <div class="history-actions">
          <div class="quality-toggle" role="radiogroup" aria-label="Quality for Download all">
            <button id="batch-best-btn" class="quality-badge selected" role="radio" aria-checked="true" data-quality="best">Best</button>
            <button id="batch-worst-btn" class="quality-badge" role="radio" aria-checked="false" data-quality="worst">Lowest</button>
          </div>
          <button id="download-all-btn" class="btn-link">Download all</button>
          <button id="clear-history-btn" class="btn-link">Clear</button>
        </div>
      </div>
      <input type="search" id="history-search" class="history-search" placeholder="Search history…" autocomplete="off" spellcheck="false" aria-label="Search history">
      <div id="history-list" role="listbox" aria-label="Previously detected media"></div>
      <p id="history-empty" class="history-empty hidden">No match</p>
    </div>

    <!-- Download Progress -->
    <div id="download-progress" class="download-progress hidden">
      <div class="progress-header">
        <span id="progress-filename">downloading…</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Downloading…"></div>
      </div>
      <div class="progress-info">
        <span id="progress-speed"></span>
        <span id="progress-eta"></span>
        <button id="cancel-btn" class="btn btn-cancel">Cancel</button>
      </div>
    </div>
    
    <!-- Error -->
    <div id="error" class="error hidden" role="alert" aria-live="polite">
      <span id="error-message"></span>
      <button id="error-dismiss" class="btn-dismiss" aria-label="Dismiss error">&times;</button>
    </div>
    
  </div>
  
  <script src="../../dist/popup.js"></script>
</body>
</html>
