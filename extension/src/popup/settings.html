<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <title>Flux Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <h1>Settings</h1>
      <a id="close-btn" class="icon-btn" href="popup.html" aria-label="Back to videos" title="Back to videos">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"></path>
          <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"></path>
        </svg>
      </a>
    </header>
    
    <div class="settings-content">
      <!-- Theme -->
      <div class="setting-item">
        <span class="setting-label">Appearance</span>
        <div class="theme-segmented" id="theme-selector" role="radiogroup" aria-label="Theme Selection">
          <button type="button" class="theme-option" data-theme="light" role="radio" aria-checked="false" aria-label="Light Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            Light
          </button>
          <button type="button" class="theme-option" data-theme="dark" role="radio" aria-checked="false" aria-label="Dark Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            Dark
          </button>
          <button type="button" class="theme-option" data-theme="system" role="radio" aria-checked="false" aria-label="System Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            System
          </button>
        </div>
        <p class="setting-help">Choose how Flux looks</p>
      </div>


      <!-- History -->
      <div class="setting-item">
        <span class="setting-label">Video List</span>
        <div class="segmented" id="history-mode" role="radiogroup" aria-label="What the video list keeps">
          <button type="button" class="segmented-option" data-history="keep" role="radio" aria-checked="false">History</button>
          <button type="button" class="segmented-option" data-history="current" role="radio" aria-checked="false">Only current</button>
        </div>
        <p class="setting-help">Only current clears the list down to what your open tabs are playing</p>
      </div>

      <!-- Grouping -->
      <div class="setting-item">
        <span class="setting-label">Grouping</span>
        <div class="segmented" id="group-mode" role="radiogroup" aria-label="How videos are listed">
          <button type="button" class="segmented-option" data-group="flat" role="radio" aria-checked="false">Flat list</button>
          <button type="button" class="segmented-option" data-group="domain" role="radio" aria-checked="false">By site</button>
        </div>
        <p class="setting-help">By site collects each page's videos under a folder you can download in one go</p>
      </div>

      <!-- Flux Status -->
      <div class="setting-item">
        <span class="setting-label">Flux Status</span>
        <div class="status-display">
          <span id="coapp-status" class="status-indicator checking">Checking…</span>
          <span id="coapp-version" class="version-text"></span>
        </div>
        <p id="coapp-error" class="setting-help error hidden" role="alert"></p>
      </div>
    </div>
  </div>
  
  <script src="../../dist/settings.js"></script>
</body>
</html>
