version: 2
updates:
  # Dev tooling only (there are no runtime dependencies). Minor and patch
  # updates arrive as one weekly pull request; a new major version is a
  # migration that someone should choose to do, so it is left alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dev-tooling:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # A 0.x minor is a breaking change, and 0.3 rewrites the chrome.* types the
      # whole extension compiles against. Migrate it on purpose, not by bot.
      - dependency-name: '@types/chrome'
        update-types: ['version-update:semver-minor']

  # The workflows' actions, together, once a month. CI runs on the pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
