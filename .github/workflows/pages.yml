name: Download page

# Builds the page in site/ and, on main, publishes it to GitHub Pages. On pull
# requests it only builds, so a broken page is caught before it is merged.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'extension/src/popup/**'
      - 'extension/public/icons/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'extension/src/popup/**'
      - 'extension/public/icons/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
